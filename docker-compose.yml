services:
  mongodb:
    image: mongo:7
    container_name: authboiler-mongodb
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -ec
      - |
        set -o pipefail
        keyfile=/data/db/.mongodb-keyfile
        if [ ! -s "$keyfile" ]; then
          umask 177
          head -c 756 /dev/urandom | base64 | tr -d '\n' > "$keyfile.tmp"
          chmod 400 "$keyfile.tmp"
          chown 999:999 "$keyfile.tmp"
          mv "$keyfile.tmp" "$keyfile"
        fi
        chmod 400 "$keyfile"
        chown 999:999 "$keyfile"
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile "$keyfile" --bind_ip_all
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-authboiler}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "try { rs.status() } catch (e) { rs.initiate({_id:''rs0'',members:[{_id:0,host:''mongodb:27017''}]}); quit(1); } const status = rs.status(); quit(status.ok === 1 && status.myState === 1 ? 0 : 1)"',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: authboiler-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app/backend
      - /app/node_modules
      - /app/backend/node_modules
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USERNAME:?MONGO_USERNAME is required}:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongodb:27017/${MONGO_DATABASE:-authboiler}?authSource=admin&replicaSet=rs0&w=majority&retryWrites=true
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: authboiler-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app/frontend
      - ./shared/core:/app/shared/core
      - ./shared/sdk:/app/shared/sdk
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/frontend/.next
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    depends_on:
      - backend
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3000/en/auth/login',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge
