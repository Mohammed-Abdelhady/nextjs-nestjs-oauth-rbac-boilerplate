name: CI

on:
  pull_request:
    branches: [staging, master]
    types: [opened, synchronize, reopened]
  push:
    branches: [staging, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  range-scan:
    name: Hard-ban range
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Scan event commits
        run: node scripts/ci.mjs --range

  quality:
    name: Quality gates
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Resolve Mongo binary cache
        id: mongo
        run: node scripts/ci.mjs --cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.mongo.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.mongo.outputs.key }}
      - name: Install dependencies
        run: node scripts/ci.mjs --install
      - name: Run quality gates
        run: node scripts/ci.mjs --quality

  # repository-only:start
  installer:
    name: Installer combinations
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Resolve Mongo binary cache
        id: mongo
        run: node scripts/ci.mjs --cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.mongo.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.mongo.outputs.key }}
      - name: Install dependencies
        run: node scripts/ci.mjs --install
      - name: Test generated projects
        run: node scripts/ci.mjs --installer
  # repository-only:end
