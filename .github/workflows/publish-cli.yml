name: publish-cli

on:
  push:
    tags:
      - 'create-nest-next-auth@*'

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@^11.5.0

      - name: Install dependencies
        run: npm ci

      - name: Check the tag against the package version
        run: |
          tag_version="${GITHUB_REF_NAME#create-nest-next-auth@}"
          package_version="$(node -p "require('./packages/create-nest-next-auth/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "tag $tag_version does not match package version $package_version"
            exit 1
          fi

      - name: Build the CLI and embed the template
        run: npm run build -w packages/create-nest-next-auth

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/create-nest-next-auth
